<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Core Atlas · 香山模型</title>
  <style>
    :root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;background:#0b1620;color:#e5eff4}
    *{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh}
    nav{display:flex;gap:8px;align-items:center;padding:7px clamp(12px,3vw,40px);border-bottom:1px solid #354c57;background:#10222c;flex-wrap:wrap}
    nav span{color:#b4c8cf;margin-right:5px}nav a{padding:4px 10px;color:#d0e3e7;text-decoration:none;border-radius:4px}
    nav a[aria-current=page]{background:#24483e;color:#b4f2d7}nav a:hover,nav a:focus-visible{text-decoration:underline}
    #separate{margin-left:auto;color:#a9d6ca}iframe{border:0;display:block;flex:1;min-height:0;width:100%}
  </style>
</head>
<body>
<nav aria-label="模型选择"><span>模型</span><a href="#gem5-1" data-file="../GEM5-1.html">GEM5-1</a><a href="#zenas" data-file="../GEM5-2.html">GEM5-2 · zenas-dev</a><a id="separate" target="_blank" rel="noopener">独立打开 ↗</a></nav>
<iframe id="viewer" title="生成的模型页面"></iframe>
<script>
  const models = [...document.querySelectorAll('nav a[data-file]')];
  function selectModel() {
    const selected = models.find(link => link.hash === location.hash) || models[0];
    for (const link of models) {
      if (link === selected) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    }
    const file = selected.dataset.file;
    document.getElementById('viewer').src = file;
    document.getElementById('separate').href = file;
    document.title = selected.textContent + ' · Core Atlas';
  }
  addEventListener('hashchange', selectModel);
  selectModel();
</script>
</body>
</html>
