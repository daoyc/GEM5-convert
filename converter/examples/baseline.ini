# Synthetic XS-GEM5 parameter fixture A. See project README.md.
[system]
type=System

[system.cpu0]
type=BaseO3CPU
cpu_id=0
numROBEntries=352
RobCompressPolicy=none
LQEntries=120
SQEntries=64
enableDispatchStage=False
renameWidth=8
enablePredecode=True
commitWidth=8

[system.cpu0.branchPred]
type=DecoupledBPUWithBTB
ftq_size=64

[system.cpu0.branchPred.ubtb]
type=UBTB
enabled=True

[system.cpu0.branchPred.abtb]
type=AheadBTB
enabled=True

[system.cpu0.branchPred.microtage]
type=MicroTAGE
enabled=True

[system.cpu0.branchPred.mbtb]
type=MBTB
enabled=True

[system.cpu0.branchPred.tage]
type=BTBTAGE
enabled=True

[system.cpu0.branchPred.ittage]
type=BTBITTAGE
enabled=True

[system.cpu0.branchPred.mgsc]
type=BTBMGSC
enabled=True

[system.cpu0.branchPred.ras]
type=BTBRAS
enabled=True

[system.cpu0.mmu]
type=RiscvMMU

[system.cpu0.mmu.itb]
type=RiscvTLB
size=48
enable_l1_direct_compression=True

[system.cpu0.mmu.dtb]
type=RiscvTLB
size=48
enable_l1_direct_compression=True

[system.cpu0.mmu.l2_shared]
type=RiscvTLB
l2tlb_l0_size=256
l2tlb_l1_size=8
l2tlb_l2_size=16
l2tlb_l3_size=16
l2tlb_sp_size=16

[system.cpu0.icache]
type=Cache
size=65536
assoc=4
prefetcher=Null

[system.cpu0.icache.replacement_policy]
type=TreePLRURP

[system.cpu0.dcache]
type=Cache
size=65536
assoc=4
prefetcher=Null

[system.cpu0.dcache.replacement_policy]
type=TreePLRURP

